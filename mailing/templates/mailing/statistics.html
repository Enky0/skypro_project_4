{% extends 'base.html' %}

{% block title %}Mailing{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-sm-6 col-md-4 col-lg-3 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Всего успешных попыток</h5>
                    <p class="card-text">{{ total_successful_attempts }}</p>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-md-4 col-lg-3 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Всего неуспешных попыток</h5>
                    <p class="card-text">{{ total_failed_attempts }}</p>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-md-4 col-lg-3 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Всего попыток</h5>
                    <p class="card-text">{{ total_mailing_attempts }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
