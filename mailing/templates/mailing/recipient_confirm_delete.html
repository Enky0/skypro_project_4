{% extends 'base.html' %}

{% block title %}Mailing{% endblock %}

{% block content %}
<div class="container mt-5">
    <p>Вы уверены, что хотите удалить получателя "{{ recipient.initials }}, {{ recipient.email }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'home' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
